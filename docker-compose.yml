x-opennews-common: &opennews-common
  build:
    context: .
  image: trading-opennews-collector:latest
  env_file:
    - .env
  environment:
    OPENNEWS_DATA_DIR: /data/opennews
  volumes:
    - /root/trading/data/opennews:/data/opennews
  restart: "no"

services:
  opennews-news-collector:
    <<: *opennews-common
    command:
      - --profile
      - news-score-80
      - --engine-type
      - news
      - --split-profile-by-engine
      - --min-score
      - "80"
      - --adaptive-pages
      - --limit
      - "20"
      - --min-pages
      - "1"
      - --max-pages
      - "100"
      - --no-stop-on-known-item
      - --stop-after-known-pages
      - "1"

  opennews-listing-collector:
    <<: *opennews-common
    command:
      - --profile
      - listing-all
      - --engine-type
      - listing
      - --split-profile-by-engine
      - --adaptive-pages
      - --limit
      - "100"
      - --min-pages
      - "1"
      - --initial-pages
      - "100"
      - --max-pages
      - "100"
      - --no-stop-on-known-item
      - --stop-after-known-pages
      - "1"

  opennews-news-enricher:
    <<: *opennews-common
    entrypoint:
      - python
      - /app/scripts/opennews_enricher.py
    command:
      - --min-text-length
      - "160"
      - --batch-size
      - "20"
      - --max-batch-characters
      - "30000"
      - --max-tokens
      - "32768"

  opennews-listing-enricher:
    <<: *opennews-common
    entrypoint:
      - python
      - /app/scripts/opennews_listing_enricher.py
    command:
      - --batch-size
      - "20"
      - --max-batch-characters
      - "30000"
      - --max-tokens
      - "32768"
